/**:
  ros__parameters:
    calib_ekf:
      verbose: true  # Enable verbose logging for debugging purposes.
      debug_verbose: false  # Enable additional debug logging for EKF internals (e.g., state, covariance).
      debug_publish_hz: -1.0  # Per-plugin debug topic rate (Hz). -1 = max rate, 0 = disabled, >0 = fixed rate
      timer_hz: 100.0  # EKF update rate in Hz (default: 100 Hz).
      max_update_latency_ms: 1000.0  # Max age (ms) of a pose/odom/mocap measurement before it is dropped (out-of-sequence handling).
      gravity: 9.81  # Gravitational acceleration (m/s^2).
      earth_map_transform: # By default, the plugin will set the earth to map transform on the first received pose.
        static_tf: true  # Publish earth to map as tf_static (true) or dynamic tf (false).
        set_earth_map: false  # Manually set earth to map transform if true.
        position:
          x: 0.0
          y: 0.0
          z: 0.0
        orientation:
          roll: 0.0
          pitch: 0.0
          yaw: 0.0
      initial_covariance:
        position: 0.0       # Initial variance for x, y, z position states.
        velocity: 0.0       # Initial variance for vx, vy, vz velocity states.
        orientation: 0.0    # Initial variance for roll, pitch, yaw. Mapped onto the quaternion states through G(q).
        bias_acc: 1e-8      # Initial variance for accelerometer bias states (bax, bay, baz).
        bias_gyro: 1e-8     # Initial variance for gyroscope bias states (bwx, bwy, bwz).
        extrinsic_translation: 1.0e-4  # Initial variance for the camera lever arm (ex, ey, ez), m^2.
        extrinsic_rotation: 3.0e-4     # Initial variance for the camera mount angles, rad^2 (~1 deg).
        intrinsics_focal: 0.0          # Initial variance for fx, fy, px^2. Zero freezes them.
        intrinsics_center: 0.0         # Initial variance for cx, cy, px^2. Zero freezes them.
      camera:
        # Used to reject landmarks projecting outside the image. 0.0 disables the check.
        # Must be written as floats: ROS 2 parameter types are strict, and a bare
        # 640 would be declared as an integer.
        image_width: 640.0
        image_height: 480.0
        initial_intrinsics:
          fx: 500.0
          fy: 500.0
          cx: 320.0
          cy: 240.0
        initial_extrinsics:
          translation: [0.1, 0.0, 0.05]  # Camera origin in the body frame, m.
          # Nominal mount rotation (camera -> body). The estimated extrinsic angles are
          # small deltas about this, which keeps them away from the gimbal lock of the
          # Rz*Ry*Rx parameterisation. A nadir camera sits exactly on that singularity,
          # so this must describe the real mount.
          nominal_rotation:
            roll: 0.0
            pitch: 0.0
            yaw: 0.0
      process_noise:
        extrinsic_translation_random_walk: 1.0e-8  # Lever arm random walk. Zero freezes the states exactly.
        extrinsic_rotation_random_walk: 1.0e-8     # Mount angle random walk.
        intrinsics_focal_random_walk: 0.0          # Focal length random walk. Zero (with zero initial variance) freezes fx/fy.
        intrinsics_center_random_walk: 0.0         # Principal point random walk.
      points_update:
        enabled: false  # Subscribe to landmark observations and run the reprojection update.
        topic: "sensor_measurements/landmarks"  # vision_msgs/msg/Detection2DArray.
        max_landmarks: 16      # Cap on landmarks fused in a single update.
        pixel_sigma: 1.0       # Pixel noise standard deviation.
        chi2_threshold: 5.991  # Mahalanobis gate, 95% for 2 degrees of freedom.
        min_depth: 0.2         # Reject landmarks closer than this along the optical axis, m.
        pixel_margin: 0.0      # Slack around the image bounds, px.
        # Known map points, in the MAP frame. Each id must match Detection2D.id.
        # landmark_ids must stay commented out while empty: an empty YAML list has
        # no inferable type and ROS 2 would load it as an unset parameter.
        # landmark_ids: ["l0", "l1"]
        # landmarks:
        #   l0: [1.0, 2.0, 0.0]
        #   l1: [3.0, 1.0, 0.5]
      platform_topic: "platform/info"  # Topic to subscribe for platform offboard status.
      use_arm: false  # If true, use arm msg, if false, use offboard boolean for EKF reset logic.
      predict_topic: "sensor_measurements/imu"  # Topic to subscribe for EKF prediction step.
      imu_params:
        accelerometer_noise_density: 1e-3
        gyroscope_noise_density: 1e-4
        accelerometer_random_walk: 1e-4
        gyroscope_random_walk: 1e-5
      update_topics:  # List of topics to subscribe for EKF update step.
        - "gazebo"
      gazebo:
        topic: "ground_truth/pose"  # Topic to subscribe for pose measurements.
        type: "geometry_msgs/msg/PoseStamped"  # Message type: PoseStamped, PoseWithCovarianceStamped, nav_msgs/msg/Odometry, or mocap4r2_msgs/msg/RigidBodies.
        set_earth_map: true  # Use this topic to set earth to map transform.
        use_message_covariance: false  # If true: use message covariance (for PoseWithCovarianceStamped/Odometry) or multipliers, if false: use fixed covariance values.
        position_covariance: [1e-4, 1e-4, 1e-4] # Fixed covariance values: x, y, z (used when use_message_covariance=false)
        orientation_covariance: [1e-5, 1e-5, 1e-5] # Fixed covariance values: roll, pitch, yaw (used when use_message_covariance=false)
        # position_multiplier: [1.0, 1.0, 1.0] # Covariance multipliers: x, y, z (used when use_message_covariance=true with PoseWithCovarianceStamped/Odometry)
        # orientation_multiplier: [1.0, 1.0, 1.0] # Covariance multipliers: roll, pitch, yaw (used when use_message_covariance=true with PoseWithCovarianceStamped/Odometry)
        # update_rate_hz: 15.0  # Optional: cap how often this topic feeds the EKF (Hz). 0 or omitted = no limit (use the topic's full rate).
      # Example: mocap4r2_msgs/msg/RigidBodies topic (add "mocap" to update_topics to enable)
      # mocap:
      #   topic: "mocap/rigid_bodies"  # Topic to subscribe for mocap rigid body measurements.
      #   type: "mocap4r2_msgs/msg/RigidBodies"  # Message type for Vicon/OptiTrack via mocap4r2.
      #   rigid_body_name: "33"  # Name of the rigid body to track (must match mocap system config).
      #   set_earth_map: true  # Use this topic to set earth to map transform.
      #   use_message_covariance: false  # RigidBodies has no covariance — always uses fixed values.
      #   position_covariance: [1e-4, 1e-4, 1e-4]  # Fixed covariance: x, y, z.
      #   orientation_covariance: [1e-5, 1e-5, 1e-5]  # Fixed covariance: roll, pitch, yaw.
      #   update_rate_hz: 15.0  # Optional: cap how often this topic feeds the EKF (Hz). 0 or omitted = no limit.